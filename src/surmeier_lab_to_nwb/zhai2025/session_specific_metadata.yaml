figure_4_confocal_spine_density_nikon:
  NWBFile:
    session_description: >
      High-resolution confocal z-stacks of {num_stacks} proximal dendrite segments of sparsely labeled iSPNs from
      mouse {mouse_number} ({condition}), the data of Figure 4J and Supplementary Figure 5. Fixed sagittal sections
      were imaged on a Nikon AXR confocal with a 60x oil immersion objective (NA 1.49), 0.09 µm pixels and 0.125 µm z
      steps, on {imaging_days}. The stacks are the raw acquisitions; the lab then denoised and deconvolved them in
      NIS-Elements AR 5.41.02 and counted spines in Imaris 10.0.0 on segments about 30 µm long, about 30 µm from the
      soma. The session start is the acquisition of the first stack.
    surgery_addition: >
      To label a few iSPNs, AAV9-pCAG-flex-eGFP-WPRE (Addgene #51502; 0.45 µl, 5 x 10^10 viral genomes/ml), which
      expresses eGFP only in cells with Cre, was injected into the left dorsolateral striatum at AP 0.7, ML -2.35 and
      DV about 3.35 mm relative to Bregma, in Adora2-Cre mice about 2 months old.
    on_state_pharmacology: >
      On-state mice received a sixth dose of levodopa (12 mg/kg, with 12 mg/kg benserazide) one hour before
      anesthesia.
    slices: >
      Mice were anesthetized with isoflurane and then a ketamine/xylazine mixture, and transcardially perfused with
      PBS (about 20 ml) and then 4% paraformaldehyde (about 30 ml). Brains were post-fixed in 4% paraformaldehyde for
      1.5 to 2 hours and stored at 4 °C in PBS with 0.1% sodium azide. Sagittal sections 60 µm thick containing the
      dorsolateral striatum were cut on a Leica VT1200S vibratome and mounted on glass slides under No. 1.5 cover
      glasses in ProLong Diamond Antifade Mountant (Thermo Fisher Scientific, P36961).
    keywords:
      - "confocal microscopy"
      - "spine density"
      - "dendritic spines"
      - "sparse labeling"
      - "Nikon AXR"
      - "iSPN"
  Subject:
    description: >
      Adora2-Cre mouse {mouse_number} in the lab's numbering, {group}; iSPNs sparsely labeled with a Cre-dependent
      eGFP virus, see surgery.

figure_4h_confocal_spine_density_olympus:
  NWBFile:
    session_description: >
      Overview of sparsely labeled iSPNs in the dorsolateral striatum of control mouse {animal_id}, the image of
      Figure 4H: {num_stacks} z-stack tiles, which the lab stitched, taken on an Olympus confocal with a 60x oil
      immersion objective (UPLSAP60xO, NA 1.35) and a 473 nm laser. The session start is the capture of the first
      tile.
    keywords:
      - "confocal microscopy"
      - "sparse labeling"
      - "Olympus"
      - "iSPN"

# Figure 5 Scripts
figure_5_acetylcholine_biosensor:
  NWBFile:
    session_description: >
      "GRABACh3.0 acetylcholine sensor imaging session from striatal slice - {condition} condition.
      Treatment: {treatment}, Stimulation: {stimulation}, Session {session_number} from {slice_info}.
      Two-photon microscopy acquisition of fluorescent acetylcholine dynamics in cholinergic interneurons during various pharmacological treatments."
    surgery_addition: "AAV-GRABACh3.0 injection into dorsolateral striatum for acetylcholine biosensor expression in cholinergic interneurons."
    pharmacology_conditions:
      sulpiride: "Sulpiride: D2 receptor antagonist (10 μM bath application) to block dopamine D2 receptors and investigate cholinergic modulation."
      quinpirole: "Quinpirole: D2 receptor agonist (10 μM bath application) to activate dopamine D2 receptors and modulate acetylcholine release."
      dopamine: "Dopamine: 50 nM bath application to modulate cholinergic interneuron activity and acetylcholine release dynamics."
    keywords:
      - "GRABACh3.0"
      - "acetylcholine"
      - "two-photon microscopy"
      - "cholinergic interneurons"
      - "pharmacological modulation"
  Subject:
    genotype: "C57BL/6 with GRABACh3.0 sensor"
    description: >
      "Experimental mouse with unilateral 6-OHDA lesion and GRABACh3.0 acetylcholine sensor expression in striatal cholinergic interneurons.
      Session {session_id}."

