# Session-Specific Metadata for Surmeier Lab NWB Conversion Scripts
# This file contains script-specific metadata that supplements the general_metadata.yaml

# Figure 2 Scripts
figure_2_spine_density:
  NWBFile:
    session_description: >-
      Dendritic spine density assessment in direct pathway spiny projection neurons (dSPNs) for condition {condition}.
      Two-photon laser scanning microscopy was used to acquire Z-stack images of dendritic segments at two locations:
      proximal (~40 μm from soma) and distal (>80 μm from soma). Cells {cells} of this mouse.
    keywords:
      - "spine density"
      - "dendritic spines"
      - "two-photon microscopy"
      - "dSPNs"
      - "methodology validation"
  Subject:
    description: >-
      Adult Drd1-Tdtomato transgenic mouse with unilateral 6-OHDA lesion (>95% dopamine depletion) modeling Parkinson's disease.
      Received dyskinesiogenic levodopa treatment for spine density analysis.
      dSPNs identified by Drd1-Tdtomato expression. Session {session_id}.
    # The control groups; the description above is for lesioned, levodopa-treated mice
    description_by_state:
      UnlesionedControl: >-
        Adult Drd1-Tdtomato transgenic mouse, unlesioned control: no 6-OHDA lesion and no levodopa. dSPNs identified by Drd1-Tdtomato expression. Session {session_id}.
      LesionedControl: >-
        Adult Drd1-Tdtomato transgenic mouse with unilateral 6-OHDA lesion (>95% dopamine depletion) modeling Parkinson's disease, without levodopa. dSPNs identified by Drd1-Tdtomato expression. Session {session_id}.

