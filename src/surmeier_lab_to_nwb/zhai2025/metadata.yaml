# The dataset's metadata, the one source the conversion reads. The top-level sections (NWBFile, Subject,
# ExternalResources) are what every file shares. Sessions holds, per kind of session and by its metadata key, what
# its files add: fields in braces are filled in for each file.
NWBFile:
  keywords:
    - corticostriatal
    - Parkinson disease
    - PD
    - neurodegeneration
    - dopamine depletion
    - striatum
    - levodopa-induced dyskinesia
    - dSPNs
    - iSPNs
    - indirect pathway
    - direct pathway
  related_publications:
    - "https://doi.org/10.1126/sciadv.adv8224"
  institution: Northwestern University
  lab: Surmeier Lab
  experimenter:
    - Zhai, Shenyu
    - Cui, Qiaoling
    - Wokosin, David
    - Sun, Linqing
    - Tkatch, Tatiana
    - Crittenden, Jill R.
    - Graybiel, Ann M.
    - Surmeier, D. James
  surgery: |
    Unilateral stereotaxic lesion: 1 µl of 6-hydroxydopamine
    (≈3 µg in 0.02 % ascorbate-saline) injected into the left
    medial forebrain bundle. Stereotaxic coordinates per the lab's
    6-OHDA lesion protocol: AP -0.7 mm and ML -1.2 mm from bregma;
    DV -4.75 mm from the dura surface (NOT from bregma; the protocol
    specifies that the needle is zeroed at bregma for the AP and ML
    axes but at the dura surface for the DV axis, so AP and ML are
    referenced to skull landmarks while DV is referenced to the
    brain surface). Procedure performed under isoflurane anaesthesia;
    post-operative meloxicam, saline, and warming provided. Lesion
    efficacy later confirmed by drug-free forelimb-asymmetry
    (cylinder) test.
  pharmacology: |
    Induction anaesthesia with isoflurane (5 % v/v for induction,
    2 % for maintenance). Pre-operative analgesia: meloxicam
    0.1 mg kg⁻¹ s.c. Lesion: intracranial 6-hydroxydopamine, 1 µl
    of 3.5 mg ml⁻¹ free-base 6-OHDA in 0.02 % ascorbate-saline
    into the left medial forebrain bundle. L-DOPA priming for LID:
    five i.p. injections every other day—6 mg kg⁻¹ for the first
    two sessions, 12 mg kg⁻¹ thereafter—each co-administered with
    benserazide 12 mg kg⁻¹ to inhibit peripheral decarboxylation.
  slices: |
    Sagittal slices (280-μm thick) were sectioned using a vibratome (Leica VT1200).
    After cutting, slices were incubated at 34 °C for 30 min in ACSF containing
    (in mM): 124 NaCl, 3 KCl, 1 NaH2PO4, 2.0 CaCl2, 1.0 MgCl2, 26 NaHCO3
    and 13.89 glucose, after which they were stored at room temperature until
    recording. External solutions were oxygenated with carbogen (95%CO2/5%O2)
    at all time.
